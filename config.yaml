package: surge
generate:
  client: true
  models: true
output: client.gen.go
output-options:
  resolve-type-name-collisions: true
  skip-prune: true
  # Preserve precision for all unformatted number fields.
  type-mapping:
    number:
      default:
        type: float64
compatibility:
  always-prefix-enum-values: true
